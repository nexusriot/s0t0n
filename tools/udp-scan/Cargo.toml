[package]
name = "udp-scan"
version = "0.1.0"
edition = "2021"
description = "UDP service scanner with protocol-specific payloads"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
clap = { version = "4", features = ["derive"] }
netutil = { path = "../netutil" }
scanengine = { path = "../scanengine" }
