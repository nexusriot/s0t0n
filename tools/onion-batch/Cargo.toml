[package]
name = "onion-batch"
version = "0.1.0"
edition = "2021"
description = "Batch onion-service uptime/title checker over Tor (arti)"

[dependencies]
arti-client = { version = "0.23.0", features = ["onion-service-client", "tokio", "native-tls"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "fs"] }
anyhow = "1.0"
http = "1.1"
hyper = { version = "1.2", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures = "0.3"
tor-rtcompat = "0.23"
